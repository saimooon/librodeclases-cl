<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Aula Notes | Registro de evaluaciones</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
	<script>
		tailwind.config = {
			theme: {
				extend: {
					fontFamily: { sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui'], display: ['"Space Grotesk"', 'ui-sans-serif'] },
					colors: { ink: '#15213b', paper: '#f7f8fc', teal: '#0f766e', coral: '#ef765d', sun: '#f4c95d' },
					boxShadow: { soft: '0 18px 50px rgba(21, 33, 59, .08)' }
				}
			}
		};
	</script>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
	<style>
		body { background: #f7f8fc; color: #15213b; }
		body.dark { background: #111827; color: #e5e7eb; }
		body.dark .bg-white, body.dark .bg-white\/80 { background-color: #1f2937 !important; }
		body.dark .bg-paper { background-color: #172033 !important; }
		body.dark .border-slate-200\/80, body.dark .border-slate-200, body.dark .border-slate-100 { border-color: #374151 !important; }
		body.dark .text-ink, body.dark .text-slate-500, body.dark .text-slate-600 { color: #e5e7eb !important; }
		body.dark .text-slate-400 { color: #9ca3af !important; }
		body.dark input, body.dark select { background-color: #111827; color: #f9fafb; border-color: #4b5563; }
		body.dark .hover\:bg-slate-50:hover, body.dark .hover\:bg-paper:hover { background-color: #273449 !important; }
		body.dark .sticky { background-color: #1f2937 !important; }
		body.dark .mobile-nav { background-color: rgba(31, 41, 55, .97); border-color: #374151; }
		body.dark .dashboard-course-picker { color: #ffffff; background: #1f2937; }
		body.dark .dashboard-course-picker option { color: #ffffff; background: #1f2937; }
		.mesh { background: radial-gradient(circle at 90% 5%, rgba(244,201,93,.25), transparent 28%), radial-gradient(circle at 10% 20%, rgba(15,118,110,.12), transparent 24%); }
		.fade-up { animation: fadeUp .45s ease both; }
		@keyframes fadeUp { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: translateY(0) } }
		.nav-active { color: #0f766e; background: #e5f4f1; }
		.dashboard-course-picker { color: #15213b; background: #ffffff; }
		.dashboard-course-picker option { color: #15213b; background: #ffffff; }
		.mobile-nav { padding-bottom: env(safe-area-inset-bottom); }
		@media (max-width: 1023px) { body { padding-bottom: 76px; } .mobile-nav button { min-width: 0; } .gradebook-scroll { -webkit-overflow-scrolling: touch; scrollbar-width: thin; } }
		.mobile-grade-card input { min-width: 0; }
		input:focus, select:focus { outline: 3px solid rgba(15,118,110,.15); border-color: #0f766e; }
	</style>
</head>
<body class="min-h-screen font-sans">
	<div id="app" class="min-h-screen mesh"></div>

	<script>
		const STORAGE_KEY = 'aula-notes-production-v1';
		const PRODUCTION_ROSTER = './nominas_2026_profesora_maria_jesus.json';
		const starterStudents = ['Sofía Araya', 'Tomás Bravo', 'Emilia Castro', 'Mateo Díaz', 'Antonia Espinoza', 'Lucas Fuentes', 'Isidora González', 'Benjamín Herrera'];
		const starterEvaluations = [{ id: 'ev1', title: 'Vocabulary quiz', date: '2026-03-20', weight: 15, type: 'Quiz' }, { id: 'ev2', title: 'Reading comprehension', date: '2026-04-10', weight: 25, type: 'Prueba' }, { id: 'ev3', title: 'Oral presentation', date: '2026-05-08', weight: 20, type: 'Oral' }, { id: 'ev4', title: 'Writing project', date: '2026-06-12', weight: 25, type: 'Proyecto' }, { id: 'ev5', title: 'Participation', date: '2026-07-03', weight: 15, type: 'Participación' }];
		const levels = [...Array(8)].map((_, index) => `${index + 1}º Básico`).concat([...Array(4)].map((_, index) => `${index + 1}º Medio`));
		const letters = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
		const courseColors = ['coral', 'teal', 'sun', 'blue', 'violet'];
		const id = prefix => `${prefix}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
		const makeCourse = (name, color = courseColors[Math.floor(Math.random() * courseColors.length)], demo = false) => {
			const courseId = id('course');
			const students = demo ? starterStudents.map((name, index) => ({ id: `${courseId}-s${index}`, name })) : [];
			const evaluations = demo ? starterEvaluations.map(evaluation => ({ ...evaluation, id: `${courseId}-${evaluation.id}` })) : [];
			const grades = Object.fromEntries(students.map((student, index) => [student.id, Object.fromEntries(evaluations.map((evaluation, evaluationIndex) => [evaluation.id, evaluationIndex === 0 ? 5.5 - index * .15 : evaluationIndex === 1 ? 6.1 - index * .12 : evaluationIndex === 2 ? 6.4 - index * .1 : evaluationIndex === 4 ? 6.2 - index * .1 : null]))]));
			return { id: courseId, name, level: levels.find(level => name.startsWith(level)) || 'Personalizado', letter: letters.find(letter => name.endsWith(` ${letter}`)) || '', color, scaleMin: 1, scaleMax: 7, students, evaluations, grades };
		};
		function makeState() {
			const defaultCourses = ['8º Básico B', '1º Medio B', '1º Medio D', '1º Medio F', '1º Medio G', '2º Medio F', '2º Medio G', '4º Medio E'].map((name, index) => makeCourse(name, courseColors[index % courseColors.length], true));
			return { institutions: [{ id: id('institution'), name: 'Colegio Inglés María Jesús', type: 'Colegio', courses: defaultCourses }] };
		}
		function productionState(raw) {
			const courses = raw.cursos.map((sourceCourse, index) => { const name = sourceCourse.curso.replace(/\s+/g, ' ').replace(/"/g, '').replace(/\s+2026$/, ' 2026').trim(); const course = makeCourse(name, courseColors[index % courseColors.length]); course.teacher = sourceCourse.profesor_jefe.trim(); course.sourceSheet = sourceCourse.hoja; course.students = sourceCourse.estudiantes.map(student => ({ id: `student-${student.run || id('student')}`, name: student.nombre_completo.trim(), rut: student.rut || student.run || null, order: student.n_orden, enrollment: student.n_matricula, ingreso: normalizeDate(student.ingreso) || null, retiro: normalizeDate(student.retiro) || null, active: !student.retiro })); course.grades = Object.fromEntries(course.students.map(student => [student.id, {}])); return course; }); return { institutions: [{ id: 'liceo-aplicacion-2026', name: 'Liceo de Aplicación 2026', type: 'Liceo', owner: raw.profesora_asignatura.nombre, subject: raw.profesora_asignatura.asignatura, schoolYear: raw.ano_escolar, courses }] }; }
		function migrate(raw) {
			if (raw?.institutions) { raw.institutions.forEach(inst => inst.courses.forEach(course => { course.scaleMin = Number(course.scaleMin) || 1; course.scaleMax = Number(course.scaleMax) || 7; course.evaluations.forEach(evaluation => { evaluation.date = normalizeDate(evaluation.date) || null; }); course.students.forEach(student => { student.rut = student.rut || student.run || null; delete student.run; student.ingreso = normalizeDate(student.ingreso) || null; student.retiro = normalizeDate(student.retiro) || null; student.active = student.retiro ? false : student.active !== false; }); })); return raw; }
			if (raw?.courses) return { institutions: [{ id: id('institution'), name: 'Colegio Inglés María Jesús', type: 'Colegio', courses: raw.courses }] };
			return makeState();
		}
		let state = migrate(JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'));
		localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
		let selectedInstitutionId = state.institutions[0].id;
		let selectedCourseId = state.institutions[0].courses[0]?.id;
		let view = 'dashboard';
		let toastTimer;
		let productionLoaded = false;
		let darkMode = localStorage.getItem('aula-notes-dark-mode') === 'true';
		document.body.classList.toggle('dark', darkMode);
		const $ = selector => document.querySelector(selector);
		const institution = () => state.institutions.find(item => item.id === selectedInstitutionId) || state.institutions[0];
		const selectedCourse = () => { const course = institution()?.courses.find(item => item.id === selectedCourseId) || institution()?.courses[0]; if (course) course.students.sort((first, second) => { const activeOrder = Number(second.active !== false) - Number(first.active !== false); return activeOrder || first.name.localeCompare(second.name, 'es', { sensitivity: 'base' }); }); return course; };
		const formatGrade = grade => grade == null || Number.isNaN(Number(grade)) ? '—' : Number(grade).toFixed(2).replace(/\.00$/, '.0');
		const timestamp = () => { const now = new Date(); const pad = value => String(value).padStart(2, '0'); return `${pad(now.getDate())}_${pad(now.getMonth() + 1)}_${now.getFullYear()}_${pad(now.getHours())}_${pad(now.getMinutes())}`; };
		const displayDate = value => { if (!value) return '—'; const text = String(value); const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})$/); return iso ? `${iso[3]}/${iso[2]}/${iso[1]}` : text; };
		function normalizeDate(value) { if (!value) return null; const text = String(value).trim(); const iso = text.match(/^(\d{4})-(\d{2})-(\d{2})$/); const date = iso ? `${iso[3]}/${iso[2]}/${iso[1]}` : text; if (!/^\d{2}\/\d{2}\/\d{4}$/.test(date)) return undefined; const [day, month, year] = date.split('/').map(Number); const parsed = new Date(year, month - 1, day); return parsed.getFullYear() === year && parsed.getMonth() === month - 1 && parsed.getDate() === day ? date : undefined; }
		const dateToComparable = value => { const normalized = normalizeDate(value); return normalized ? normalized.split('/').reverse().join('') : ''; };
		const dateToInput = value => { const normalized = normalizeDate(value); return normalized ? normalized.split('/').reverse().join('-') : ''; };
		const todayDisplay = () => { const now = new Date(); return `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`; };
		function updateDatePreview(input) { const preview = document.querySelector(`[data-date-preview="${input.name}"]`); if (preview) preview.textContent = input.value ? `Se guardará como ${displayDate(input.value)}` : 'Sin fecha seleccionada'; }
		const parseGrade = (value, course) => { if (value === '') return null; const numeric = Number(value); const min = Number(course?.scaleMin ?? 1); const max = Number(course?.scaleMax ?? 7); if (!Number.isFinite(numeric) || numeric < min || numeric > max || !/^\d+(\.\d{1,2})?$/.test(String(value))) return undefined; return Number(numeric.toFixed(2)); };
		const colorClasses = color => ({ coral: 'bg-[#fff0eb] text-[#c9543d]', teal: 'bg-[#e5f4f1] text-teal', sun: 'bg-[#fff7db] text-[#987513]', blue: 'bg-[#eaf1ff] text-[#4166aa]', violet: 'bg-[#f2edff] text-[#7451af]' }[color] || 'bg-slate-100 text-slate-600');
		const average = (course, studentId) => { const totalWeight = course?.evaluations.reduce((sum, evaluation) => sum + Number(evaluation.weight || 0), 0) || 1; const values = course?.evaluations.filter(evaluation => Number.isFinite(Number(course.grades?.[studentId]?.[evaluation.id]))); if (!values?.length) return null; return values.reduce((sum, evaluation) => sum + Number(course.grades[studentId][evaluation.id]) * Number(evaluation.weight || 0), 0) / totalWeight; };
		const save = message => { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); if (message) showToast(message); render(); };
		function showToast(message) { clearTimeout(toastTimer); const toast = $('#toast'); if (!toast) return; toast.textContent = message; toast.classList.remove('hidden'); toastTimer = setTimeout(() => toast.classList.add('hidden'), 2400); }
		function render() {
			const inst = institution(); const course = selectedCourse(); const courses = inst?.courses || []; const allCourses = state.institutions.reduce((sum, item) => sum + item.courses.length, 0); const totalStudents = courses.reduce((sum, item) => sum + item.students.length, 0); const totalEvaluations = courses.reduce((sum, item) => sum + item.evaluations.length, 0);
			document.querySelector('#app').innerHTML = `<div class="mx-auto flex min-h-screen max-w-[1500px]"><aside class="hidden w-72 shrink-0 border-r border-slate-200/80 bg-white/80 px-5 py-7 lg:flex lg:flex-col"><div class="mb-8 flex items-center gap-3 px-2"><div class="grid h-10 w-10 place-items-center rounded-2xl bg-ink text-lg font-bold text-white">A</div><div><p class="font-display text-lg font-bold tracking-tight">Aula Notes</p><p class="text-[11px] font-medium uppercase tracking-[.18em] text-slate-400">Gestión académica</p></div></div><label class="mb-6 block px-2"><span class="mb-2 block text-[11px] font-bold uppercase tracking-wider text-slate-400">Institución activa</span><select onchange="selectInstitution(this.value)" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-semibold">${state.institutions.map(item => `<option value="${item.id}" ${item.id === selectedInstitutionId ? 'selected' : ''}>${item.name}</option>`).join('')}</select></label><nav class="space-y-2"><button onclick="setView('dashboard')" class="${view === 'dashboard' ? 'nav-active' : 'text-slate-500 hover:bg-slate-50'} flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold"><span class="text-lg">⌂</span> Resumen</button><button onclick="setView('grades')" class="${view === 'grades' ? 'nav-active' : 'text-slate-500 hover:bg-slate-50'} flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold"><span class="text-lg">▦</span> Libro de notas</button><button onclick="setView('courses')" class="${view === 'courses' ? 'nav-active' : 'text-slate-500 hover:bg-slate-50'} flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold"><span class="text-lg">♧</span> Cursos</button><button onclick="setView('institutions')" class="${view === 'institutions' ? 'nav-active' : 'text-slate-500 hover:bg-slate-50'} flex w-full items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold"><span class="text-lg">▣</span> Instituciones</button></nav><div class="mt-auto rounded-2xl bg-ink p-4 text-white"><p class="mb-1 text-xs font-semibold uppercase tracking-wider text-slate-300">${inst?.type || 'Institución'}</p><p class="font-display text-lg font-bold">${inst?.name || 'Sin institución'}</p><p class="mt-2 text-xs text-slate-300">${courses.length} cursos activos</p></div></aside><main class="min-w-0 flex-1 px-4 py-5 sm:px-7 lg:px-10 lg:py-8"><header class="mb-8 flex items-center justify-between"><div><p class="mb-1 text-sm font-medium text-slate-400">Martes, 22 de septiembre de 2026 · ${inst?.name || ''}</p><h1 class="font-display text-2xl font-bold tracking-tight sm:text-3xl">${view === 'dashboard' ? 'Hola, María Jesús' : view === 'grades' ? 'Libro de notas' : view === 'courses' ? 'Cursos' : 'Instituciones'}</h1></div><div class="relative flex items-center gap-3"><button onclick="toggleProfileMenu()" title="Abrir perfil y herramientas" class="grid h-10 w-10 place-items-center rounded-full bg-[#f4c95d] font-display font-bold text-ink">MJ</button><div id="profile-menu" class="absolute right-0 top-12 z-30 hidden w-64 rounded-2xl border border-slate-200 bg-white p-2 shadow-soft"><p class="px-3 py-2 text-xs font-bold uppercase tracking-wider text-slate-400">Herramientas</p><button onclick="toggleDarkMode()" class="flex w-full items-center justify-between rounded-xl px-3 py-2.5 text-left text-sm font-semibold text-ink hover:bg-slate-50"><span>Modo oscuro</span><span>${darkMode ? '☀' : '☾'}</span></button><label class="block px-3 py-2.5 text-sm font-semibold text-ink"><span class="mb-1 block">Formato de exportación</span><select id="export-format" class="w-full rounded-lg border border-slate-200 px-2 py-1.5 text-sm"><option value="csv">CSV</option><option value="xlsx">XLSX</option><option value="json">JSON</option></select></label><button onclick="exportData()" class="w-full rounded-xl bg-teal px-3 py-2.5 text-left text-sm font-bold text-white">Exportar</button><button onclick="document.querySelector('#import-file').click()" class="w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold text-ink hover:bg-slate-50">Importar CSV / XLSX / JSON</button><button onclick="clearData()" class="mt-1 w-full rounded-xl px-3 py-2.5 text-left text-sm font-semibold text-coral hover:bg-[#fff0eb]">Borrar datos</button></div><input id="import-file" type="file" accept=".csv,.xlsx,.xls,.json" class="hidden" onchange="importData(this.files[0])"></div></header>${view === 'dashboard' ? dashboard(course, courses, totalStudents, totalEvaluations, allCourses) : view === 'grades' ? gradebook(course, courses) : view === 'courses' ? coursesView(course, courses) : institutionsView()}</main></div><div class="fixed bottom-5 right-5 z-50 hidden rounded-xl bg-ink px-4 py-3 text-sm font-semibold text-white shadow-soft" id="toast"></div>`;
		}
		function dashboard(course, courses, totalStudents, totalEvaluations, allCourses) { const averages = course?.students.map(student => average(course, student.id)).filter(Boolean) || []; const classAverage = averages.length ? averages.reduce((a, b) => a + b, 0) / averages.length : 0; const pending = course?.students.reduce((sum, student) => sum + course.evaluations.filter(evaluation => course.grades?.[student.id]?.[evaluation.id] == null).length, 0) || 0; return `<section class="fade-up"><div class="mb-7 flex flex-col justify-between gap-4 rounded-3xl bg-ink p-6 text-white shadow-soft sm:flex-row sm:items-end sm:p-8"><div><div class="mb-5 inline-flex items-center gap-2 rounded-full bg-white/10 px-3 py-1 text-xs font-semibold text-slate-200"><span class="h-2 w-2 rounded-full bg-sun"></span> Panel de profesora</div><h2 class="max-w-lg font-display text-3xl font-bold leading-tight sm:text-4xl">Tus clases, <span class="text-sun">más claras.</span></h2><p class="mt-3 max-w-md text-sm leading-6 text-slate-300">Organiza instituciones, cursos, evaluaciones y notas desde un solo lugar.</p></div><div class="rounded-2xl bg-white/10 p-4 sm:min-w-48"><p class="text-xs text-slate-300">Promedio del curso</p><p class="mt-1 font-display text-4xl font-bold">${formatGrade(classAverage)}</p><p class="mt-1 text-xs text-slate-300">${course?.name || 'Sin cursos'} · escala 1.0 a 7.0</p></div></div><div class="mb-7 grid gap-4 sm:grid-cols-2 xl:grid-cols-4"><div class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">Cursos activos</p><p class="mt-3 font-display text-3xl font-bold">${allCourses}</p><p class="mt-2 text-xs text-slate-400">En ${state.institutions.length} institución(es)</p></div><div class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">Estudiantes</p><p class="mt-3 font-display text-3xl font-bold">${totalStudents}</p><p class="mt-2 text-xs text-slate-400">En esta institución</p></div><div class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">Evaluaciones</p><p class="mt-3 font-display text-3xl font-bold">${totalEvaluations}</p><p class="mt-2 text-xs text-slate-400">Registradas en sus cursos</p></div><div class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm"><p class="text-sm text-slate-500">Notas pendientes</p><p class="mt-3 font-display text-3xl font-bold">${pending}</p><p class="mt-2 text-xs text-slate-400">${course?.name || 'Selecciona un curso'}</p></div></div><div class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm sm:p-6"><div class="mb-5 flex items-center justify-between"><div><h3 class="font-display text-lg font-bold">Cursos asignados</h3><p class="mt-1 text-sm text-slate-400">${institution()?.name || ''}</p></div><button onclick="setView('courses')" class="text-sm font-bold text-teal hover:underline">Gestionar →</button></div><div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">${courses.map(item => `<button onclick="selectCourse('${item.id}'); setView('grades')" class="group rounded-xl border border-slate-100 p-4 text-left hover:border-teal/30 hover:bg-paper"><span class="grid h-10 w-10 place-items-center rounded-xl text-sm font-bold ${colorClasses(item.color)}">${item.name.split(' ')[0]}</span><span class="mt-3 block font-semibold">${item.name}</span><span class="mt-1 block text-xs text-slate-400">${item.students.length} estudiantes · ${item.evaluations.length} evaluaciones</span></button>`).join('')}</div></div></section>`; }
		function courseTabs(courses) { return courses.map(item => `<button onclick="selectCourse('${item.id}')" class="whitespace-nowrap rounded-full px-4 py-2 text-sm font-semibold ${item.id === selectedCourseId ? 'bg-ink text-white' : 'bg-white text-slate-500 ring-1 ring-slate-200'}">${item.name}</button>`).join(''); }
		function gradebook(course, courses) { if (!course) return emptyState('No hay cursos en esta institución.', 'course'); return `<section class="fade-up"><div class="mb-5 flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div><p class="text-sm text-slate-400">Curso seleccionado</p><select onchange="selectCourse(this.value)" class="mt-2 rounded-xl border border-slate-200 bg-white px-3 py-2.5 text-sm font-semibold">${courses.map(item => `<option value="${item.id}" ${item.id === course.id ? 'selected' : ''}>${item.name}</option>`).join('')}</select></div><button onclick="openModal('evaluation')" class="rounded-xl bg-teal px-4 py-2.5 text-sm font-bold text-white">+ Nueva evaluación</button></div><div class="mb-5 flex gap-2 overflow-x-auto pb-1">${courseTabs(courses)}</div><div class="overflow-hidden rounded-2xl border border-slate-200/80 bg-white shadow-sm"><div class="flex flex-col justify-between gap-3 border-b border-slate-100 p-5 sm:flex-row sm:items-center"><div><h2 class="font-display text-xl font-bold">${course.name}</h2><p class="mt-1 text-sm text-slate-400">${course.students.length} estudiantes · escala ${course.scaleMin.toFixed(1)}–${course.scaleMax.toFixed(1)} · ponderación total: ${course.evaluations.reduce((sum, evaluation) => sum + Number(evaluation.weight), 0)}%</p></div><button onclick="openModal('student')" class="rounded-xl border border-slate-200 px-3 py-2 text-sm font-bold text-ink hover:border-teal hover:text-teal">+ Estudiante</button></div><div class="overflow-x-auto"><table class="w-full min-w-[900px] text-left text-sm"><thead class="bg-paper text-xs uppercase tracking-wider text-slate-400"><tr><th class="sticky left-0 bg-paper px-5 py-4 font-semibold">Estudiante</th>${course.evaluations.map(evaluation => `<th class="min-w-32 px-3 py-4 font-semibold"><div class="flex items-start justify-between gap-2"><span>${evaluation.title}<small class="mt-1 block normal-case tracking-normal text-teal">${evaluation.weight}% · ${evaluation.type}</ 		function decorateMobileGradebook() { if (view !== 'grades') return; const course = selectedCourse(); const table = document.querySelector('table'); const scroll = table?.closest('.overflow-x-auto'); if (!course || !table || !scroll) return; scroll.classList.add('hidden', 'lg:block'); let panel = document.querySelector('.mobile-gradebook'); if (!panel) { panel = document.createElement('div'); panel.className = 'mobile-gradebook space-y-3 lg:hidden'; scroll.parentElement.appendChild(panel); } const signature = `${course.id}:${course.students.length}:${course.evaluations.length}:${course.students.map(student => student.id).join(',')}`; if (panel.dataset.signature === signature) return; panel.dataset.signature = signature; panel.innerHTML = course.students.map(student => `<article class="mobile-grade-card rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"><div class="mb-3 flex items-start justify-between gap-3"><div class="min-w-0"><h3 class="truncate font-display text-base font-bold">${student.name}</h3><p class="mt-1 text-xs text-slate-400">${student.rut || 'RUT no registrado'} · ${student.active !== false ? 'Activo' : 'Inactivo'}</p></div><span class="shrink-0 rounded-lg px-2 py-1 text-xs font-bold ${average(course, student.id) >= 4 ? 'bg-[#e5f4f1] text-teal' : 'bg-[#fff0eb] text-coral'}">${formatGrade(average(course, student.id))}</span></div><div class="space-y-2">${course.evaluations.map(evaluation => `<label class="flex items-center justify-between gap-3 text-xs"><span class="min-w-0 truncate font-semibold text-slate-500">${evaluation.title}<small class="ml-1 text-teal">${evaluation.weight}%</small></span><input aria-label="Nota de ${student.name} en ${evaluation.title}" onchange="setGrade('${student.id}','${evaluation.id}',this.value)" value="${course.grades?.[student.id]?.[evaluation.id] ?? ''}" type="number" min="${course.scaleMin}" max="${course.scaleMax}" step="0.01" placeholder="—" class="h-9 w-20 rounded-lg border border-slate-200 px-2 text-center font-semibold"></label>`).join('')}</div><div class="mt-4 flex items-center justify-end gap-3 border-t border-slate-100 pt-3"><button onclick="editStudent('${student.id}')" class="text-xs font-bold text-teal">Editar estudiante</button><button onclick="removeStudent('${student.id}')" class="text-xs font-bold text-coral">Retirar</button></div></article>`).join(''); }
		function saveStudentRecord(event, studentId) { event.preventDefault(); const course = selectedCourse(); const student = course?.students.find(item => item.id === studentId); const data = Object.fromEntries(new FormData(event.target)); if (!student) return; const ingreso = normalizeDate(data.ingreso); const retiro = normalizeDate(data.retiro); if ((data.ingreso && !ingreso) || (data.retiro && !retiro)) return showToast('Usa fechas válidas con formato DD/MM/AAAA'); if (data.status === 'inactive' && !retiro) return showToast('Registra una fecha de retiro para inactivar al estudiante'); if (ingreso && retiro && dateToComparable(ingreso) > dateToComparable(retiro)) return showToast('El ingreso no puede ser posterior al egreso'); student.name = data.name.trim(); student.rut = data.rut?.trim() || null; student.ingreso = ingreso; student.active = data.status === 'active'; student.retiro = student.active ? null : retiro; closeStudentRecordModal(); save('Estado y datos del estudiante actualizados'); }
		function removeStudent(studentId) { const course = selectedCourse(); const student = course?.students.find(item => item.id === studentId); if (!student || !confirm(`Se abrirá el registro de retiro de ${student.name}. Sus notas e historial se conservarán. ¿Continuar?`)) return; editStudent(studentId, true); }
		function removeEvaluation(evaluationId) { if (!confirm('¿Eliminar esta evaluación y sus notas?')) return; const course = selectedCourse(); course.evaluations = course.evaluations.filter(evaluation => evaluation.id !== evaluationId); Object.values(course.grades).forEach(grades => delete grades[evaluationId]); save('Evaluación eliminada'); }
		function removeCourse(courseId) { const inst = institution(); if (!confirm('¿Eliminar este curso, sus estudiantes y sus evaluaciones?')) return; inst.courses = inst.courses.filter(course => course.id !== courseId); selectedCourseId = inst.courses[0]?.id; save('Curso eliminado'); }
		function removeInstitution(institutionId) { if (state.institutions.length === 1) return showToast('Debe existir al menos una institución'); if (!confirm('¿Eliminar esta institución y toda su información?')) return; state.institutions = state.institutions.filter(item => item.id !== institutionId); selectedInstitutionId = state.institutions[0].id; selectedCourseId = institution().courses[0]?.id; save('Institución eliminada'); }
		function toggleProfileMenu() { $('#profile-menu')?.classList.toggle('hidden'); }
		function toggleDarkMode() { darkMode = !darkMode; localStorage.setItem('aula-notes-dark-mode', darkMode); document.body.classList.toggle('dark', darkMode); render(); }
		function exportRows() { const rows = []; state.institutions.forEach(inst => inst.courses.forEach(course => course.students.forEach(student => course.evaluations.forEach(evaluation => rows.push({ Institucion: inst.name, 'Tipo institucion': inst.type, Curso: course.name, Nivel: course.level, Letra: course.letter, Estudiante: student.name, RUT: student.rut || '', Estado: student.active !== false ? 'Activo' : 'Inactivo', Ingreso: displayDate(student.ingreso), Retiro: displayDate(student.retiro), Evaluacion: evaluation.title, Fecha: displayDate(evaluation.date), Ponderacion: evaluation.weight, 'Tipo evaluacion': evaluation.type, Nota: course.grades?.[student.id]?.[evaluation.id] ?? '' }))))); return rows; }
		function exportData() { const format = $('#export-format')?.value || 'csv'; const rows = exportRows(); if (!rows.length) return showToast('No hay datos para exportar'); const fileBase = `aula-notes-datos_${timestamp()}`; if (format === 'json') { const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json;charset=utf-8' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${fileBase}.json`; link.click(); URL.revokeObjectURL(link.href); } else { const worksheet = XLSX.utils.json_to_sheet(rows); const workbook = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(workbook, worksheet, 'Aula Notes'); if (format === 'xlsx') XLSX.writeFile(workbook, `${fileBase}.xlsx`); else { const csv = XLSX.utils.sheet_to_csv(worksheet); const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }); const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = `${fileBase}.csv`; link.click(); URL.revokeObjectURL(link.href); } } toggleProfileMenu(); showToast(`Datos exportados en ${format.toUpperCase()}`); }
		function importData(file) { if (!file) return; const reader = new FileReader(); const fileName = file.name.toLowerCase(); const isCsv = fileName.endsWith('.csv'); const isJson = fileName.endsWith('.json'); reader.onload = event => { try { if (isJson) { const imported = JSON.parse(event.target.result); if (!imported?.institutions) throw new Error('Formato'); if (!confirm('La importación reemplazará los datos actuales. ¿Continuar?')) return; state = migrate(imported); selectedInstitutionId = state.institutions[0]?.id; selectedCourseId = state.institutions[0]?.courses[0]?.id; save('Datos JSON importados correctamente'); return; } const workbook = isCsv ? XLSX.read(event.target.result, { type: 'string' }) : XLSX.read(event.target.result, { type: 'array' }); const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { defval: '' }); if (!rows.length || !rows[0].Institucion || !rows[0].Curso) throw new Error('Formato'); if (!confirm('La importación reemplazará los datos actuales. ¿Continuar?')) return; const institutions = []; const institutionMap = new Map(); const courseMap = new Map(); rows.forEach(row => { const institutionKey = `${row.Institucion}|${row['Tipo institucion'] || 'Colegio'}`; if (!institutionMap.has(institutionKey)) { const item = { id: id('institution'), name: String(row.Institucion), type: String(row['Tipo institucion'] || 'Colegio'), courses: [] }; institutionMap.set(institutionKey, item); institutions.push(item); } const inst = institutionMap.get(institutionKey); const courseKey = `${inst.id}|${row.Curso}`; if (!courseMap.has(courseKey)) { const course = makeCourse(String(row.Curso)); course.level = String(row.Nivel || 'Personalizado'); course.letter = String(row.Letra || ''); inst.courses.push(course); courseMap.set(courseKey, course); } const course = courseMap.get(courseKey); let student = course.students.find(item => item.name === String(row.Estudiante)); if (!student) { student = { id: id('student'), name: String(row.Estudiante) }; course.students.push(student); course.grades[student.id] = {}; } let evaluation = course.evaluations.find(item => item.title === String(row.Evaluacion)); if (!evaluation) { evaluation = { id: id('evaluation'), title: String(row.Evaluacion), date: String(row.Fecha || ''), weight: Number(row.Ponderacion) || 0, type: String(row['Tipo evaluacion'] || 'Prueba') }; course.evaluations.push(evaluation); } course.grades[student.id][evaluation.id] = row.Nota === '' ? null : parseGrade(String(row.Nota), course); }); state = { institutions }; selectedInstitutionId = institutions[0]?.id; selectedCourseId = institutions[0]?.courses[0]?.id; save('Datos importados correctamente'); } catch (error) { showToast('No se pudo leer el archivo. Usa el CSV/XLSX/JSON exportado por Aula Notes.'); } }; if (isCsv || isJson) reader.readAsText(file); else reader.readAsArrayBuffer(file); }
		function clearData() { if (!confirm('Se borrarán todas las instituciones, cursos, estudiantes, evaluaciones y notas. Esta acción no se puede deshacer. ¿Continuar?')) return; state = { institutions: [] }; selectedInstitutionId = undefined; selectedCourseId = undefined; view = 'institutions'; save('Todos los datos fueron borrados'); }
		async function loadProductionRoster() { if (localStorage.getItem(`${STORAGE_KEY}-loaded`) === 'true') return; try { const response = await fetch(PRODUCTION_ROSTER, { cache: 'no-store' }); if (!response.ok) throw new Error('No se pudo cargar la nómina'); const raw = await response.json(); state = productionState(raw); selectedInstitutionId = state.institutions[0].id; selectedCourseId = state.institutions[0].courses[0]?.id; localStorage.setItem(`${STORAGE_KEY}-loaded`, 'true'); localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); productionLoaded = true; render(); } catch (error) { showToast('No se pudo cargar la nómina de producción. Verifica que el JSON esté junto al index.'); } }
		const studentStatusObserver = new MutationObserver(() => { decorateStudentStatuses(); decorateStudentModal(); decorateDashboardAverage(); decorateMobileNavigation(); decorateMobileGradebook(); decorateActiveInstitution(); });
		studentStatusObserver.observe(document.body, { childList: true, subtree: true });
		window.addEventListener('popstate', event => { if (event.state?.view) { view = event.state.view; render(); } else { view = 'dashboard'; render(); } });
		history.replaceState({ view: 'dashboard' }, '', '#dashboard');
		render();
		loadProductionRoster();
	</script>
